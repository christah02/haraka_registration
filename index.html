<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haraka Association Limited - Army Children Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #006600;
            text-align: center;
        }
        .form-header {
            background-color: #f0f8ff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .radio-group {
            display: flex;
            gap: 15px;
        }
        .radio-option {
            display: flex;
            align-items: center;
        }
        .radio-option input {
            margin-right: 5px;
        }
        button {
            background-color: #006600;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #004d00;
        }
        .required {
            color: red;
        }
        .footer-contact{
            background-color:#f7f7f7;
            padding: 20px;
            border-top: 1px solid #ddd;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-header">
        <h1>Haraka Association Limited</h1>
        <h2>Army Children Registration Form</h2>
    </div>

    <form id="registrationForm" action="https://formsubmit.co/harakaassociation@gmail.com" method="POST">
       <input type="hidden" name="_subject" value="New Registration">
        <!-- Child Information Section -->
        <fieldset>
            <legend>Child Information</legend>
            
            <div class="form-group">
                <label for="childName">Full Name of Child <span class="required">*</span></label>
                <input type="text" id="childName" name="childName" required>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth <span class="required">*</span></label>
                <input type="date" id="dob" name="dob" required>
            </div>
            
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="male" name="gender" value="Male" required>
                        <label for="male">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="female" name="gender" value="Female">
                        <label for="female">Female</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="other" name="gender" value="Other">
                        <label for="other">Other</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="nin">National Identification Number (NIN)</label>
                <input type="text" id="nin" name="nin" pattern="[A-Z0-9]{14}" title="14-digit NIN number">
            </div>
            
            <div class="form-group">
                <label for="occupation">Occupation (if applicable)</label>
                <input type="text" id="occupation" name="occupation">
            </div>
            
            <div class="form-group">
                <label for="address">Full Address <span class="required">*</span></label>
                <textarea id="address" name="address" rows="3" required></textarea>
            </div>
        </fieldset>

        <!-- Parent Information Section -->
        <fieldset>
            <legend>Parent Information</legend>
            
            <div class="form-group">
                <label for="parentName">Full Name of Parent in the Army <span class="required">*</span></label>
                <input type="text" id="parentName" name="parentName" required>
            </div>
            
            <div class="form-group">
                <label>Sex of Parent <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="parentMale" name="parentSex" value="Male" required>
                        <label for="parentMale">Male</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="parentFemale" name="parentSex" value="Female">
                        <label for="parentFemale">Female</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="armyNumber">Parent's Army Number <span class="required">*</span></label>
                <input type="text" id="armyNumber" name="armyNumber" required>
            </div>
            
            <div class="form-group">
                <label for="rank">Rank of Parent in the Army <span class="required">*</span></label>
                <input type="text" id="rank" name="rank" required>
            </div>
            
            <div class="form-group">
                <label>Parent's Status <span class="required">*</span></label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="alive" name="parentStatus" value="Alive" required>
                        <label for="alive">Alive</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="deceased" name="parentStatus" value="Deceased">
                        <label for="deceased">Deceased</label>
                    </div>
                </div>
            </div>
        </fieldset>

        <div class="form-group" style="text-align: center; margin-top: 20px;">
            <button type="submit">Submit Registration</button>
        </div>
        <div class="footer-contact">
            <h4>for more information:</h4>
            <p>contact us</p>
            <li> Email: <a href="mailto: harakaassociation@gmail.com">harakaassociation@gmail.com</a>
            </li>
        </div>
    </form>
</body>
</html>
